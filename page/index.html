<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkBuddy Plus</title>
  <link rel="stylesheet" href="board.css"><link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script><script src="data.js"></script><script src="board.js"></script><script src="app.js" defer></script>
</head>
<body class="wb-board">
  <header>
    <div><h1>WorkBuddy Plus</h1><p class="muted" id="state">读取中…</p></div>
    <div class="actions">
      <button type="button" class="quiet" data-action="login">添加账号</button>
      <button type="button" class="quiet" data-action="travel">猫猫旅行</button>
      <button type="button" class="quiet" id="schedule" data-action="pause">暂停定时</button>
      <button type="button" class="quiet" id="intl" data-action="intl-off" hidden>关闭国际版任务</button>
      <button type="button" data-action="refresh">刷新</button>
      <button type="button" data-action="all">全部执行</button>
    </div>
  </header>
  <p id="note" class="note" role="status" hidden></p>
  <section id="board"></section>
  <section><h2>最近执行</h2><div id="jobs"></div></section>
  <section><details id="settings"><summary>定时与设置 <span class="muted">执行时段、随机错开、时区、代理</span></summary>
    <form id="settings-form">
      <div class="fields">
        <label>活跃 / 旅行 / 连登福利<input name="daily" placeholder="HH:MM, HH:MM"></label>
        <label>成长任务<input name="tasks" placeholder="HH:MM, HH:MM"></label>
        <label>夜猫子任务<input name="night" placeholder="HH:MM"></label>
        <label>登录续期检查<input name="keepalive" placeholder="HH:MM"></label>
        <label>随机错开（分钟，0 关闭）<input name="spread" type="number" min="0" max="60" step="1"></label>
        <label>时区<input name="timezone" placeholder="Asia/Shanghai"></label>
        <label class="wide">HTTP 代理（可留空）<input name="proxy" placeholder="http://127.0.0.1:7890"></label>
      </div>
      <p class="muted">同类多个时段用逗号分隔，清空可关闭该类定时。保存后由 Magpie 重载插件交给后台服务，Docker 等打不开本机面板时在这里改。</p>
      <button type="submit">保存设置</button>
    </form>
  </details></section>
  <footer class="muted">余额与旅行状态由后台服务约每 10 分钟刷新；按钮会让 Magpie 重载插件后交给后台服务执行。完整日志在本机面板 <span id="panel">http://127.0.0.1:3439</span>（与 Magpie 在同一台电脑上时可打开）。</footer>
</body>
</html>
