<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkBuddy Plus</title>
  <link rel="stylesheet" href="board.css"><link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script><script src="data.js"></script><script src="board.js"></script><script src="app.js" defer></script>
</head>
<body class="wb-board">
  <header>
    <div><h1>WorkBuddy Plus</h1><p class="muted" id="state">读取中…</p></div>
    <div class="actions">
      <button type="button" class="quiet" data-action="login">添加账号</button>
      <button type="button" class="quiet" data-action="travel">猫猫旅行</button>
      <button type="button" class="quiet" id="schedule" data-action="pause">暂停定时</button>
      <button type="button" data-action="refresh">刷新</button>
      <button type="button" data-action="all">全部执行</button>
    </div>
  </header>
  <p id="note" class="note" role="status" hidden></p>
  <section id="board"></section>
  <section><h2>最近执行</h2><div id="jobs"></div></section>
  <footer class="muted">余额与旅行状态由后台服务约每 10 分钟刷新；按钮会让 Magpie 重载插件后交给后台服务执行。时段、代理与完整日志在本机面板 http://127.0.0.1:3439。</footer>
</body>
</html>
