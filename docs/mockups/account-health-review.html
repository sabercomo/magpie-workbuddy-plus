<style>

rentColor;flex:none}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.neutral{color:var(--muted)}.segments{display:flex;gap:2px;padding:3px;background:color-mix(in srgb,var(--muted) 10%,transparent);border-radius:8px}.segments button{border:0;background:transparent;color:var(--muted);font-size:11.5px;padding:4px 9px;border-radius:6px}.segments button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px #0001;font-weight:600}.matrix{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:visible}.table-scroll{overflow:auto;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:12px}th{color:var(--muted);background:var(--inset);font-size:11px;font-weight:500;text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}td{padding:14px 12px;vertical-align:top;border-bottom:1px solid var(--line)}th:first-child,td:first-child{padding-right:0;width:28px}th:last-child{text-align:right}.main-row:hover{background:color-mix(in srgb,var(--muted) 3%,transparent)}.main-row.selected{background:color-mix(in srgb,var(--accent) 4%,var(--card))}.account{gap:9px;min-width:122px}.avatar{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--accent);font-size:11px;font-weight:600;flex:none}.row-toggle{display:flex;align-items:center;gap:5px;border:0;padding:0;background:transparent;font-size:12px;font-weight:600;text-align:left}.row-toggle i{font-style:normal;font-size:16px;line-height:1;color:var(--muted);transition:transform 180ms ease}.row-toggle[aria-expanded=true] i{transform:rotate(90deg)}.account-name{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell-meta{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}.health-cell{min-width:176px}.growth-cell{min-width:146px}.row-actions{justify-content:flex-end;gap:1px;opacity:.6}.main-row:hover .row-actions,.main-row:focus-within .row-actions{opacity:1}.text-button{padding:3px 7px;font-size:11.5px;border:0;background:transparent;border-radius:5px;color:inherit}.text-button:hover{background:var(--soft);color:var(--accent)}.menu{position:relative}.menu summary{list-style:none;padding:3px 7px;font-weight:650;cursor:pointer}.menu summary::-webkit-details-marker{display:none}.menu-list{position:absolute;top:26px;right:0;min-width:122px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:5;box-shadow:0 8px 24px #0002}.menu-list button{display:block;width:100%;text-align:left}.drawer-row td{padding:0;border:0}.disclosure{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 240ms cubic-bezier(.32,.72,0,1),opacity 160ms ease}.disclosure.open{grid-template-rows:1fr;opacity:1}.disclosure-inner{overflow:hidden}.diagnostics{background:var(--inset);padding:14px 24px 16px 52px;border-bottom:1px solid var(--line)}.details-head{justify-content:space-between;flex-wrap:wrap}.details-head p{margin:3px 0 0}.retry-chain{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}.retry-chain li{position:relative;border-left:1px solid var(--line);margin-left:4px;padding:5px 0 8px 14px;display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;font-size:11.5px}.retry-chain li:before{content:'';position:absolute;left:-3px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--bad)}.retry-chain time{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.retry-chain .meta{flex-basis:100%}.batchbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:480px;position:fixed;z-index:10;bottom:22px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;gap:0;padding:4px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px #0002;transition:transform 220ms cubic-bezier(.32,.72,0,1),opacity 160ms ease;font-size:12px;max-width:calc(100vw - 32px)}.batchbar.visible{opacity:1;pointer-events:auto;transform:translate(-50%,0)}.batchbar .text-button{width:100%;min-height:36px;padding:8px 4px;font-size:12px;text-align:center}.selection-note{margin:0 2px 8px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}.hint{margin:10px 2px;color:var(--muted);font-size:11.5px}.feedback{min-height:20px;margin:10px 2px;color:var(--accent);font-size:12px}input[type=checkbox]{accent-color:var(--accent);cursor:pointer;margin:3px 0 0}.footer{font-size:11px;color:var(--muted);margin-top:20px}
@media(max-width:900px){th,td{padding-inline:9px}.toolbar{align-items:flex-start}.matrix table{min-width:830px}.table-scroll{padding-bottom:3px}.header-sub{margin-left:0}}
@media(max-width:600px){main{padding:16px 14px 140px}.header-actions{gap:6px}.header-actions .button{font-size:11.5px}nav{gap:0}.titleline{gap:7px;flex-wrap:wrap}.summary{gap:8px 14px}.filters{width:100%}.segments{width:100%}.segments button{flex:1;padding-inline:5px}.batchbar{width:calc(100vw - 28px);bottom:14px}.diagnostics{padding-left:20px}.row-actions{opacity:1}.hint{line-height:1.6}}
@media(prefers-reduced-motion:reduce){.disclosure,.batchbar,.row-toggle i{transition:none}.button:active,.text-button:active{transform:none}}
@media(prefers-reduced-transparency:reduce){.batchbar{background:var(--card);backdrop-filter:none}}
@media(prefers-contrast:more){.batchbar,.matrix{border-color:var(--fg)}}
</style>
<main>
<header><div><div class="titleline"><button class="nav-toggle" aria-label="切换导航样式">◫</button><h1>WorkBuddy Plus</h1><span class="pill">● 定时运行中 · 下次 21:10</span></div><p class="header-sub meta">余额更新于 11/18 20:43 · 刷新</p></div><div class="header-actions"><button class="button primary">▶ 立即执行⌄</button><button class="button">＋ 添加账号⌄</button><button class="button">设置</button></div></header>
<nav aria-label="主导航"><span>看板 <small>6 账号</small></span><span class="selected">账号与健康</span><span>任务 <small>2 待办</small></span><a href="schedule-queue-review.html">定时与记录</a><span>模型</span></nav>
<div class="intro"><h2>账号与健康</h2><p class="meta">查看各号的任务、签到和健康状态。暂停任务后，看板继续更新。</p></div>
<div class="toolbar"><div class="summary" id="health-summary"></div><div class="filters"><div class="segments" aria-label="账号范围" id="filters"></div></div></div>
<p id="selected-count" class="selection-note" role="status" hidden></p>
<div class="matrix">
  <div class="matrix-head" aria-hidden="true"><span></span><span>账号</span><span>健康状态 · 下次定时</span><span>每日签到 · 加油站</span><span>成长任务 · 福利活动</span><span>快捷操作</span></div>
  <div class="account-list" id="accounts" aria-label="账号健康与任务列表"></div>
</div>
<p class="hint">点击账号名称展开诊断与最近失败重试链；勾选后批量操作。</p><p class="feedback" role="status" id="feedback"></p>
<p class="footer">独立交互样稿 · 全部为虚构数据 · 窄窗口自动转为完整账号卡片</p>
</main>
<div class="batchbar" id="batchbar" aria-label="批量操作" inert><button class="text-button" data-batch="balance">刷新余额</button><button class="text-button" data-batch="pause">暂停账号任务</button><button class="text-button" id="clear">取消选择</button></div>
<script>
const $=id=>document.getElementById(id), el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const accounts=[
{id:'a',name:'主力号',meta:'国内个人 · 成长连登 16 天',kind:'cn',state:'normal',status:'正常',tone:'ok',success:'20:43 余额与签到',failures:0,next:'21:10 活跃·旅行',checkin:'已签到 +100',checkinSub:'00:00 · 加油站连签 4 天',growth:'成长 4/4 · 福利 3/3 已领',expert:'工作台搭建师',points:'107 / 8,840 积分',expiry:'最近一笔积分 11/22 作废'},
{id:'b',name:'备用号',meta:'国内个人 · 成长连登 16 天',kind:'cn',state:'limited',status:'请求退避 · 20 秒',tone:'warn',success:'20:30 猫猫派出',failures:1,next:'21:10 活跃·旅行',checkin:'已签到 +100',checkinSub:'00:00 · 加油站连签 4 天',growth:'成长 3/4 · 福利 3/3 已领',expert:'代码架构评审师',points:'437 / 7,025 积分',expiry:'最近一笔积分 11/25 作废',retries:[['首次请求','20:41:02','HTTP 429','等待 5 秒后重试'],['重试 1/2','20:41:07','HTTP 429','等待 20 秒后重试']]},
{id:'c',name:'工作号',meta:'国内个人 · 成长连登 2 天',kind:'cn',state:'paused',status:'任务已暂停',tone:'neutral',success:'20:42 签到核对',failures:0,next:'暂停期间不执行',checkin:'已签到 +100',checkinSub:'00:12 · 官方快照已核对',growth:'成长 4/4 · 福利已领',expert:'工作台搭建师',points:'1,191 / 3,364 积分',expiry:'最近一笔积分 11/28 作废'},
{id:'d',name:'企业账号',meta:'企业 · 每月 2,000 积分',kind:'enterprise',state:'normal',status:'正常 · 只读看板',tone:'ok',success:'20:43 余额同步',failures:0,next:'仅刷新看板',checkin:'—',checkinSub:'无个人签到',growth:'企业配额',expert:'不执行个人成长任务',points:'43 / 2,000 积分',expiry:'12/01 月度额度重置'},
{id:'e',name:'海外号',meta:'国际版 · 成长连登 12 天',kind:'intl',state:'failed',status:'连续失败 · 3 次',tone:'bad',success:'11/17 21:01',failures:3,next:'21:01 活跃·福利',checkin:'今日奖励 +30',checkinSub:'国际版每日活跃奖励',growth:'福利等待重试',expert:'不执行国内成长任务',points:'55 / 460 积分',expiry:'最近一笔积分 12/01 作废',retries:[['首次请求','20:01:04','HTTP 429','等待 5 秒后重试'],['重试 1/2','20:01:09','HTTP 429','等待 20 秒后重试'],['重试 2/2','20:01:29','HTTP 429','本轮请求停止重试，等待定时补跑']]},
{id:'f',name:'测试号',meta:'国内个人 · 模型额度用完',kind:'cn',state:'quota',status:'模型额度用完',tone:'warn',success:'19:10 余额刷新',failures:0,next:'21:10 活跃·旅行',checkin:'已签到 +100',checkinSub:'00:04 · Magpie 记录',growth:'成长 4/4 · 福利已领',expert:'当前任务全部完成',points:'0 / 1,500 积分',expiry:'模型额度 22:56 恢复'}
];
const selected=new Set(),expanded=new Set();let scope='all';
const visible=()=>accounts.filter(a=>scope==='all'||scope==='cn'&&a.kind==='cn'||scope==='abnormal'&&a.state!=='normal');
function status(text,tone){const n=el('span','status '+tone);n.append(el('i','dot'),text);return n}
function feedback(text){$('feedback').textContent=text}
function perform(a,action){const names={balance:'刷新余额',retry:'重试失败操作'};feedback(`样稿演示：已提交 ${a.name} 的${names[action]}，执行结果以后台回传为准。`)}
function pause(a){a.state=a.state==='paused'?'normal':'paused';a.status=a.state==='paused'?'任务已暂停':'正常';a.tone=a.state==='paused'?'neutral':'ok';a.next=a.state==='paused'?'暂停期间不执行':'21:10 活跃·旅行';feedback(`样稿演示：${a.name} ${a.state==='paused'?'任务已暂停，看板继续更新':'已恢复任务'}`);render()}
function actionButton(text,fn){const b=el('button','text-button',text);b.type='button';b.onclick=fn;return b}
function render(){
const summary=$('health-summary');summary.replaceChildren();for(const [text,states,tone]of[['正常',['normal'],'ok'],['需留意',['limited','quota'],'warn'],['连续失败',['failed'],'bad'],['已暂停',['paused'],'neutral']]){const n=status(text,tone);n.append(el('strong','',accounts.filter(a=>states.includes(a.state)).length));summary.append(n)}
const filters=$('filters');filters.replaceChildren();for(const [key,label,count] of [['all','全部账号',accounts.length],['cn','国内个人',accounts.filter(a=>a.kind==='cn').length],['abnormal','仅看异常',accounts.filter(a=>a.state!=='normal').length]]){const b=el('button','',`${label} ${count}`);b.setAttribute('aria-pressed',String(scope===key));b.onclick=()=>{scope=key;render()};filters.append(b)}
const body=$('accounts');body.replaceChildren();for(const a of visible()){
const tr=el('tr','main-row'+(selected.has(a.id)?' selected':''));tr.dataset.id=a.id;const pick=el('td'),checkbox=el('input');checkbox.type='checkbox';checkbox.checked=selected.has(a.id);checkbox.setAttribute('aria-label',`选择 ${a.name}`);checkbox.onchange=()=>{checkbox.checked?selected.add(a.id):selected.delete(a.id);render()};pick.append(checkbox);
const who=el('td'),account=el('div','account'),info=el('div'),toggle=el('button','row-toggle');toggle.type='button';toggle.setAttribute('aria-expanded',String(expanded.has(a.id)));toggle.setAttribute('aria-controls',`detail-${a.id}`);toggle.append(el('span','account-name',a.name),el('i','','›'));toggle.onclick=()=>{expanded.has(a.id)?expanded.delete(a.id):expanded.add(a.id);const drawer=$(`detail-${a.id}`);drawer.classList.toggle('open',expanded.has(a.id));toggle.setAttribute('aria-expanded',String(expanded.has(a.id)))};info.append(toggle,el('div','cell-meta',a.meta));account.append(el('span','avatar',a.name[0]),info);who.append(account);
const health=el('td','health-cell');health.append(status(a.status,a.tone),el('div','cell-meta',`最近成功 ${a.success}`),el('div','cell-meta',`下次 ${a.next}`));
const sign=el('td');sign.append(status(a.checkin,a.kind==='enterprise'?'neutral':'ok'),el('div','cell-meta',a.checkinSub));const growth=el('td','growth-cell');growth.append(el('span','',a.growth),el('div','cell-meta',a.expert));
const cell=el('td'),actions=el('div','row-actions');actions.append(actionButton('余额',()=>perform(a,'balance')));const menu=el('details','menu'),trigger=el('summary','','⋯'),items=el('div','menu-list');trigger.setAttribute('aria-label',`${a.name} 更多操作`);if(a.kind!=='enterprise')items.append(actionButton(a.state==='paused'?'恢复任务':'暂停任务',()=>pause(a)));if(a.retries)items.append(actionButton('重试失败操作',()=>perform(a,'retry')));if(items.childElementCount){menu.append(trigger,items);actions.append(menu)}cell.append(actions);tr.append(pick,who,health,sign,growth,cell);body.append(tr);
const detailRow=el('tr','drawer-row'),td=el('td');td.colSpan=6;const drawer=el('div','disclosure'+(expanded.has(a.id)?' open':''));drawer.id=`detail-${a.id}`;const inner=el('div','disclosure-inner'),diagnostics=el('div','diagnostics'),head=el('div','details-head'),heading=el('div');heading.append(el('strong','',`${a.name} · 诊断与积分`),el('p','meta',`${a.points} · 连续失败 ${a.failures} 次 · ${a.expiry}`));head.append(heading);if(a.retries)head.append(actionButton('重试失败操作',()=>perform(a,'retry')));diagnostics.append(head);if(a.retries){const chain=el('ol','retry-chain');for(const [step,time,code,note]of a.retries){const line=el('li');line.append(el('strong','',step),el('span','bad',code),el('time','',time),el('span','meta',note));chain.append(line)}diagnostics.append(chain)}else diagnostics.append(el('p','meta','近期没有记录到失败重试。'));inner.append(diagnostics);drawer.append(inner);td.append(drawer);detailRow.append(td);body.append(detailRow)
}
const list=visible();$('select-all').checked=list.length>0&&list.every(a=>selected.has(a.id));$('select-all').indeterminate=list.some(a=>selected.has(a.id))&&!$('select-all').checked;syncBatch()
}
function syncBatch(){const visible=selected.size>0;$('batchbar').classList.toggle('visible',visible);$('batchbar').inert=!visible;$('selected-count').hidden=!visible;$('selected-count').textContent=`已选 ${selected.size} 个账号`}
$('select-all').onchange=e=>{for(const a of visible())e.target.checked?selected.add(a.id):selected.delete(a.id);render()};$('clear').onclick=()=>{selected.clear();render()};for(const b of document.querySelectorAll('[data-batch]'))b.onclick=()=>{const ids=[...selected],action=b.dataset.batch,applicable=accounts.filter(a=>ids.includes(a.id)&&(action==='balance'||action==='pause'&&a.kind!=='enterprise'));if(action==='pause'){for(const a of applicable){a.state='paused';a.status='任务已暂停';a.tone='neutral';a.next='暂停期间不执行'}}feedback(`样稿演示：已向 ${applicable.length} 个适用账号提交${b.textContent}。`);selected.clear();render()};
document.addEventListener('click',e=>{for(const menu of document.querySelectorAll('details.menu[open]'))if(!menu.contains(e.target))menu.open=false});document.addEventListener('keydown',e=>{if(e.key==='Escape')for(const menu of document.querySelectorAll('details.menu[open]')){menu.open=false;menu.querySelector('summary').focus()}});render();
</script>
</html>
